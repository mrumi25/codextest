name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild bundled HTML
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat payload/chunk*.txt | base64 --decode | gzip -d > app/src/main/assets/index.html
          ACTUAL=$(sha256sum app/src/main/assets/index.html | cut -d' ' -f1)
          EXPECTED=f63a11b5f2ae042d4474bf738cf5d8db799453725b5025c4b9538df2f159fa06
          echo "HTML SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd5e-dice-lab-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
