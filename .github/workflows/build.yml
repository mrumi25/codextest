name: Build Apologetic Asteroid APK

on:
  push:
    branches: [apologetic-asteroid-apk-fix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild game HTML
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat $(find apologetic_payload -maxdepth 1 -type f -name 'chunk*.txt' | sort -V) | base64 --decode | gzip -d > app/src/main/assets/index.html
          ACTUAL=$(sha256sum app/src/main/assets/index.html | cut -d' ' -f1)
          EXPECTED=0b8f288963c4718cdfe3d4bbcedb446e97035cbcd16dc5b6059e6ebd53f42d48
          echo "HTML SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          grep -q '<script src="three.min.js"></script>' app/src/main/assets/index.html

      - name: Bundle Three.js offline
        shell: bash
        run: |
          curl -L --fail --retry 4 https://raw.githubusercontent.com/mrdoob/three.js/r160/build/three.min.js -o app/src/main/assets/three.min.js
          test $(wc -c < app/src/main/assets/three.min.js) -gt 600000
          echo "Three.js bytes: $(wc -c < app/src/main/assets/three.min.js)"

      - name: Syntax check game JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('app/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert blocks, 'inline game script missing'
          pathlib.Path('/tmp/game.js').write_text(blocks[-1])
          PY
          node --check /tmp/game.js

      - name: Build S23 APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'assets/index.html'
          unzip -l "$APK" | grep 'assets/three.min.js'
          unzip -p "$APK" assets/three.min.js | wc -c
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apologetic-asteroid-s23-offline-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
